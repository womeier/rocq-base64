---
# Kept for reference and for the opam metadata; the coq-community template
# generator is not run on this project, so README.md, rocq-base64.opam and the
# workflow under .github/workflows are maintained by hand and must be kept in
# sync with this file manually.
fullname: rocq-base64
shortname: rocq-base64
organization: womeier
community: false
action: false

synopsis: Verified RFC 4648 base64 encoding and decoding in Rocq

description: |-
  Base64 encoding and strict decoding over lists of bytes, proved correct in
  both directions, parameterized over the alphabet and over whether the output
  is padded. Ships the RFC 4648 section 4 (standard) and section 5 (base64url)
  alphabets, together with bridges that lift the whole theory to MetaRocq's
  bytestrings and to Rocq's primitive strings.

authors:
- name: Wolfgang Meier
  initial: true

maintainers:
- name: Wolfgang Meier
  nickname: womeier

opam-file-maintainer: womeier@posteo.de

opam-file-version: dev

license:
  fullname: MIT License
  identifier: MIT

supported_rocq_versions:
  text: 9.1 (the version MetaRocq 1.5.1 is packaged for)
  opam: '{>= "9.1" & < "9.2~"}'

tested_rocq_opam_versions:
- version: '9.1'

dependencies:
- opam:
    name: rocq-metarocq-utils
    version: '{>= "1.5.1"}'
  description: |-
    [MetaRocq](https://metarocq.github.io) (only the `Utils` package, for its
    bytestrings)

namespace: base64

keywords:
- name: base64
- name: RFC 4648
- name: strings
- name: bytes

categories:
- name: Computer Science/Data Types and Data Structures
---
