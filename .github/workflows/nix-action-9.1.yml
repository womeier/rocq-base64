# Hand-written, not produced by `genNixActions`.  The generated form enumerates
# one job per (reverse-)dependency; for a leaf library with a single heavy
# dependency that is just a longer way of saying `nix-build`, and it has to be
# regenerated whenever MetaRocq's nixpkgs job names change.  If a full
# per-dependency graph is ever wanted, run
#   nix-shell --arg do-nothing true --run genNixActions
# and commit what it writes.
name: Nix CI for bundle 9.1
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  base64:
    runs-on: ubuntu-latest
    steps:
    - name: Git checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Nix install
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixpkgs-unstable
    - name: Cachix setup
      uses: cachix/cachix-action@v16
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extraPullNames: coq,coq-community
        name: metarocq
    - name: Build MetaRocq (cached)
      run: nix-build --no-out-link --argstr bundle "9.1" --argstr job "metarocq"
    - name: Build rocq-base64
      run: nix-build --no-out-link --argstr bundle "9.1" --argstr job "base64"
